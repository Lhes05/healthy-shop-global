<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Healthy Shop Global</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #102018;
    }

    .hello {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .hello h1 {
      margin: 0;
      font-size: 56px;
    }

    .hello h1 span {
      color: #087f45;
    }

    .hello p {
      color: #63716a;
      font-size: 18px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <main class="hello">
    <div>
      <h1>Healthy Shop <span>Global</span></h1>
      <p>Santé Everyday Wellness</p>
    </div>
  </main>

</body>
</html>
