name: Add Leslie Chat Flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-leslie-chat:
    if: ${{ github.event.head_commit.message != 'Link Leslie Chat Flow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Link Leslie Chat script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'src="leslie-chat.js?v=1"' in s:
              raise SystemExit(0)
          tag = '  <script src="leslie-chat.js?v=1"></script>\n'
          s = s.replace('</body>', tag + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Link Leslie Chat Flow"
          git push
