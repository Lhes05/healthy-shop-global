name: Install inquiry form fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install form script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="inquiry-form-fix.js?v=1"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find closing body tag')
              text = text.replace(marker, '  ' + tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Inquiry form fix installed.')
          else:
              print('Inquiry form fix already installed.')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix inquiry form behavior [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
