name: Ensure Leslie Chat Is Linked

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-link:
    if: ${{ github.event.head_commit.message != 'Ensure Leslie Chat Script Link' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure script tag
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="leslie-chat.js?v=2"></script>'
          if tag in s:
              raise SystemExit(0)
          # Remove older Leslie script tags, then add the current one before </body>.
          import re
          s = re.sub(r'\s*<script[^>]+leslie-chat\.js[^>]*></script>', '', s, flags=re.I)
          if '</body>' not in s:
              raise SystemExit('index.html has no </body> tag')
          s = s.replace('</body>', f'  {tag}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ensure Leslie Chat Script Link"
          git push
