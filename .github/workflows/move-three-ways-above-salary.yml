name: Move Three Ways above Salary section
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Three Ways section
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          three = re.compile(r'<section id="how-it-works"[\s\S]*?</section>\s*', re.I)
          m = three.search(text)
          if not m:
              raise SystemExit('Three Ways section not found')
          block = m.group(0).strip()
          text = text[:m.start()] + text[m.end():]
          sections = list(re.finditer(r'<section\b[^>]*>[\s\S]*?</section>', text, re.I))
          target = None
          for s in sections:
              if re.search(r'DO\s+YOU\s+HAVE\s+ANY\s+OTHER\s+OPTION\s+BESIDES\s+YOUR\s+SALARY', s.group(0), re.I):
                  target = s
                  break
          if not target:
              pos = re.search(r'DO\s+YOU\s+HAVE\s+ANY\s+OTHER\s+OPTION\s+BESIDES\s+YOUR\s+SALARY', text, re.I)
              if not pos:
                  raise SystemExit('Salary section heading not found')
              target = next((s for s in sections if s.start() <= pos.start() < s.end()), None)
          if not target:
              raise SystemExit('Salary section container not found')
          text = text[:target.start()] + block + '\n' + text[target.start():]
          p.write_text(text, encoding='utf-8')
          print('Three Ways moved directly above the salary section.')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Place Three Ways above salary section"
          git pull --rebase origin main
          git push origin main