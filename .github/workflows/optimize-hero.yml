name: Optimize hero image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Sync with latest main before changing files
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Convert hero PNG to optimized WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('assets/images/product-barley-canister.png')
          dst = Path('assets/images/product-barley-canister.webp')
          im = Image.open(src).convert('RGB')
          im.save(dst, 'WEBP', quality=78, method=6)
          print(f'{src} -> {dst}: {im.width}x{im.height}')
          PY

      - name: Switch homepage hero preload and image to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/images/product-barley-canister.png', 'assets/images/product-barley-canister.webp')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push with retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/product-barley-canister.webp index.html
          git diff --cached --quiet && exit 0
          git commit -m 'perf: serve hero image as WebP'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
            from PIL import Image
            from pathlib import Path
            src = Path('assets/images/product-barley-canister.png')
            dst = Path('assets/images/product-barley-canister.webp')
            Image.open(src).convert('RGB').save(dst, 'WEBP', quality=78, method=6)
            p = Path('index.html')
            s = p.read_text(encoding='utf-8').replace('assets/images/product-barley-canister.png', 'assets/images/product-barley-canister.webp')
            p.write_text(s, encoding='utf-8')
            PY
            git add assets/images/product-barley-canister.webp index.html
            git commit -m 'perf: serve hero image as WebP' || true
          done
          exit 1
