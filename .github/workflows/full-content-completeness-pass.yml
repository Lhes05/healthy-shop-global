name: Full Content Completeness Pass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add complete content layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- SANTE FULL CONTENT COMPLETENESS PASS -->'
          if marker in s:
              raise SystemExit(0)

          head = r'''\n<!-- SANTE FULL CONTENT COMPLETENESS PASS -->\n<style>\n.sante-complete{background:#fff;color:#102018}.sante-complete .sc-wrap{width:min(1180px,calc(100% - 40px));margin:auto}.sante-complete section{padding:78px 0;scroll-margin-top:80px}.sc-kicker{display:inline-block;color:#087f45;font-size:11px;font-weight:950;letter-spacing:1.7px;text-transform:uppercase;margin-bottom:14px}.sc-title{font-size:clamp(38px,5vw,62px);line-height:1;letter-spacing:-3px;font-weight:950;margin:0 0 16px}.sc-lead{max-width:760px;color:#52605a;font-size:16px;line-height:1.7;margin:0}.sc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}.sc-card{border:1px solid #d7e5dc;border-radius:20px;padding:24px;background:#fff;box-shadow:0 12px 30px rgba(7,75,47,.07)}.sc-card h3{margin:0 0 8px;font-size:19px}.sc-card p{margin:0;color:#52605a;font-size:13px;line-height:1.6}.sc-num{width:38px;height:38px;border-radius:12px;background:#e7f6e9;color:#087f45;display:flex;align-items:center;justify-content:center;font-weight:950;margin-bottom:16px}.sc-cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}.sc-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 21px;border-radius:999px;background:#087f45;color:#fff!important;text-decoration:none!important;font-size:13px;font-weight:950}.sc-btn.alt{background:#e7f6e9;color:#087f45!important}.sc-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:30px}.sc-fact{padding:20px;border-radius:18px;background:#f5fbf7;border:1px solid #d7e5dc}.sc-fact strong{display:block;font-size:25px;margin-bottom:5px}.sc-fact span{color:#52605a;font-size:12px;line-height:1.4}.sc-faq{margin-top:28px;border-top:1px solid #d7e5dc}.sc-faq details{border-bottom:1px solid #d7e5dc;padding:18px 0}.sc-faq summary{cursor:pointer;font-weight:900;font-size:15px}.sc-faq p{margin:10px 0 0;color:#52605a;font-size:13px;line-height:1.65;max-width:850px}.sc-note{margin-top:22px;padding:16px 18px;border-left:3px solid #f5b521;background:#fffaf0;color:#52605a;font-size:12px;line-height:1.6}.sc-contact{background:#f5fbf7}.sc-contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.sc-contact-box{background:#fff;border:1px solid #d7e5dc;border-radius:20px;padding:24px}.sc-contact-box h3{margin:0 0 12px}.sc-contact-box p{margin:7px 0;color:#52605a;font-size:13px;line-height:1.55}.sc-contact-box a{color:#087f45;font-weight:800}.sc-disclaimer{font-size:11px;color:#68756f;line-height:1.6;margin-top:20px}@media(max-width:800px){.sante-complete section{padding:58px 0}.sc-grid{grid-template-columns:1fr}.sc-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.sc-contact-grid{grid-template-columns:1fr}}@media(max-width:500px){.sante-complete .sc-wrap{width:min(100% - 28px,1180px)}.sc-facts{grid-template-columns:1fr}.sc-title{letter-spacing:-2px}.sc-btn{width:100%}}\n</style>\n'''
          body = r'''\n<div class="sante-complete" id="complete-information">\n<section id="how-it-works"><div class="sc-wrap"><span class="sc-kicker">Start with Santé</span><h2 class="sc-title">Three clear ways to begin.</h2><p class="sc-lead">Whether you want wellness products, member benefits, or a business opportunity, choose the path that fits your goal.</p><div class="sc-grid"><article class="sc-card"><div class="sc-num">01</div><h3>Shop Wellness</h3><p>Explore Santé wellness products and everyday essentials through the official shopping ecosystem.</p><div class="sc-cta-row"><a class="sc-btn" href="https://partner.mysante.com/">Shop Santé</a></div></article><article class="sc-card"><div class="sc-num">02</div><h3>Become a Preferred Member</h3><p>Access member pricing, rewards and available member benefits through the official registration flow.</p><div class="sc-cta-row"><a class="sc-btn" href="https://international.mysante.com/Registration.aspx">Become a Member</a></div></article><article class="sc-card"><div class="sc-num">03</div><h3>Build a Business</h3><p>Learn about the Business Owner pathway, policies, support and requirements before you participate.</p><div class="sc-cta-row"><a class="sc-btn" href="https://partner.mysante.com/auth/login">Partner Login</a></div></article></div></div></section>\n<section id="about-sante"><div class="sc-wrap"><span class="sc-kicker">About Santé</span><h2 class="sc-title">Better health. Meaningful opportunities.</h2><p class="sc-lead">Santé International, Inc. was founded in 2007 and operates across direct selling, e-commerce, wholesale and retail distribution, online marketing and dropshipping activities.</p><div class="sc-facts"><div class="sc-fact"><strong>2007</strong><span>Founded</span></div><div class="sc-fact"><strong>Global</strong><span>International presence and shipping</span></div><div class="sc-fact"><strong>3 paths</strong><span>Shop, member, business</span></div><div class="sc-fact"><strong>Quality</strong><span>Product and manufacturing standards</span></div></div><div class="sc-note">Use only official product descriptions and approved materials when discussing Santé products or business programs. Do not make unauthorized medical, therapeutic, health or misleading claims.</div><div class="sc-cta-row"><a class="sc-btn" href="https://mysante.com/about-company">Official About Santé</a></div></div></section>\n<section id="products"><div class="sc-wrap"><span class="sc-kicker">Product guide</span><h2 class="sc-title">Know what you are choosing.</h2><p class="sc-lead">The official Santé catalog includes barley products, specialty drinks, beauty products and everyday wellness essentials. Product names, specifications, pricing and availability can change, so final details should always be confirmed on the official shop.</p><div class="sc-grid"><article class="sc-card"><h3>Santé Barley</h3><p>Barley-based wellness products sourced and presented through Santé's official product ecosystem.</p></article><article class="sc-card"><h3>Specialty Drinks</h3><p>Includes coffee and other specialty drink products shown in the current official catalog.</p></article><article class="sc-card"><h3>Beauty & Essentials</h3><p>Beauty and personal-care products are also part of the official Santé catalog.</p></article></div><div class="sc-cta-row"><a class="sc-btn" href="https://mysante.com/ph">View Official Catalog</a></div></div></section>\n<section id="faq"><div class="sc-wrap"><span class="sc-kicker">FAQ</span><h2 class="sc-title">Answers before you start.</h2><div class="sc-faq"><details><summary>Is Santé a medical treatment provider?</summary><p>No. This website should not present Santé products as cures, treatments, or substitutes for professional medical advice. Follow approved product information and applicable regulations.</p></details><details><summary>How do I place an order?</summary><p>Use the official Santé shopping platform and follow its current checkout, payment and order-verification process. Product availability and pricing can change.</p></details><details><summary>How do I become a member?</summary><p>Use the official registration flow. Registration includes terms, package/sponsor information, personal information and confirmation steps.</p></details><details><summary>How does the business opportunity work?</summary><p>Review the official Policies and Procedures and Compensation Plan before participating. Income, commissions and bonuses are not guaranteed.</p></details><details><summary>Where can I get help?</summary><p>For official customer support, use customerservice@mysante.com or the contact details published in Santé's current Terms and Conditions.</p></details><details><summary>Can prices and products change?</summary><p>Yes. Official terms state that product descriptions, pricing, images, specifications and availability may change without prior notice.</p></details></div></div></section>\n<section class="sc-contact" id="contact"><div class="sc-wrap"><span class="sc-kicker">Contact & trust</span><h2 class="sc-title">Need help or verification?</h2><p class="sc-lead">Use the official company channels for orders, account questions, business-program questions and policy concerns.</p><div class="sc-contact-grid"><div class="sc-contact-box"><h3>Santé International, Inc.</h3><p><strong>Address:</strong> UG 42 &amp; 54 Eton Cyberpod Corinthian EDSA cor. Ortigas Ave., Quezon City</p><p><strong>Email:</strong> <a href="mailto:customerservice@mysante.com">customerservice@mysante.com</a></p><p><strong>Globe:</strong> 09175528111</p><p><strong>Smart:</strong> 09209665582</p></div><div class="sc-contact-box"><h3>Official references</h3><p><a href="https://mysante.com/terms-conditions">Terms &amp; Conditions</a></p><p><a href="https://mysante.com/about-company">About Company</a></p><p><a href="https://international.mysante.com/Registration.aspx">Registration</a></p><p><a href="https://partner.mysante.com/auth/login">Partner Login</a></p><p><a href="https://store.mysante.com/wp-content/uploads/2026/01/Policies-and-Procedures.pdf">Policies &amp; Procedures</a></p></div></div><p class="sc-disclaimer">Information on this page is provided for navigation and general education. Official Santé policies, product pages, pricing, availability and current terms control where applicable.</p></div></section>\n</div>\n'''
          s = s.replace('</head>', head + '</head>', 1)
          s = s.replace('</body>', body + '</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Complete global site content and information"
          git push
