name: Optimize mobile image loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-mobile-images.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize mobile image loading [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize image loading metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = 'assets/images/product-barley-canister.png'
          tags = list(re.finditer(r'<img\b[^>]*>', s, flags=re.I))
          if not tags:
              raise SystemExit('No img elements found')

          target_index = None
          for i, m in enumerate(tags):
              src_m = re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']', m.group(0), re.I)
              if src_m and src_m.group(1) == target:
                  target_index = i
                  break
          if target_index is None:
              raise SystemExit(f'Hero image not found: {target}')

          def clean_attr(tag: str, name: str) -> str:
              return re.sub(r'\s' + name + r'\s*=\s*["\'][^"\']*["\']', '', tag, flags=re.I)

          pieces, cursor = [], 0
          for i, m in enumerate(tags):
              pieces.append(s[cursor:m.start()])
              tag = m.group(0)
              for attr in ('loading', 'fetchpriority', 'decoding'):
                  tag = clean_attr(tag, attr)
              if i == target_index:
                  tag = tag[:-1] + ' loading="eager" fetchpriority="high" decoding="async">'
              else:
                  tag = tag[:-1] + ' loading="lazy" decoding="async">'
              pieces.append(tag)
              cursor = m.end()
          pieces.append(s[cursor:])
          s = ''.join(pieces)

          s = re.sub(r'\s*<link\s+rel=["\']preload["\'][^>]*as=["\']image["\'][^>]*>', '', s, flags=re.I)
          preload = f'<link rel="preload" as="image" href="{target}" fetchpriority="high">'
          marker = '<link rel="stylesheet" href="style.css?v=27">'
          if preload not in s and marker in s:
              s = s.replace(marker, preload + '\n  ' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -q 'assets/images/product-barley-canister.png' index.html
          grep -q 'loading="eager" fetchpriority="high"' index.html
          grep -q 'loading="lazy"' index.html
          grep -q '<link rel="preload" as="image" href="assets/images/product-barley-canister.png" fetchpriority="high">' index.html

      - name: Commit and push with rebase retry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize mobile image loading [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push after 5 attempts" >&2
          exit 1
