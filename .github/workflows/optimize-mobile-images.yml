name: Optimize mobile image loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-mobile-images.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize mobile image loading [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize image loading metadata
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          hero = 'assets/images/product-barley-canister.png'
          hero_seen = False

          def tag_repl(m):
              nonlocal hero_seen
              tag = m.group(0)
              src_m = re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']', tag, re.I)
              if not src_m:
                  return tag
              src = src_m.group(1)
              is_hero = src == hero and not hero_seen
              if is_hero:
                  hero_seen = True
                  tag = re.sub(r'\sloading\s*=\s*["\'][^"\']*["\']', '', tag, flags=re.I)
                  tag = re.sub(r'\sfetchpriority\s*=\s*["\'][^"\']*["\']', '', tag, flags=re.I)
                  tag = re.sub(r'\sdecoding\s*=\s*["\'][^"\']*["\']', '', tag, flags=re.I)
                  tag = tag[:-1] + ' loading="eager" fetchpriority="high" decoding="async">'
              else:
                  if not re.search(r'\sloading\s*=', tag, re.I):
                      tag = tag[:-1] + ' loading="lazy">'
                  else:
                      tag = re.sub(r'(\sloading\s*=\s*["\'])[^"\']*(["\'])', r'\1lazy\2', tag, count=1, flags=re.I)
                  if not re.search(r'\sdecoding\s*=', tag, re.I):
                      tag = tag[:-1] + ' decoding="async">'
              return tag

          s2 = re.sub(r'<img\b[^>]*>', tag_repl, s, flags=re.I)

          preload = f'<link rel="preload" as="image" href="{hero}" fetchpriority="high">'
          if preload not in s2:
              marker = '<link rel="stylesheet" href="style.css?v=27">'
              s2 = s2.replace(marker, preload + '\n  ' + marker, 1)

          p.write_text(s2, encoding='utf-8')

      - name: Verify changes
        run: |
          grep -o 'fetchpriority="high"' index.html | head -1
          grep -o 'loading="lazy"' index.html | wc -l

      - name: Commit optimization and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/optimize-mobile-images.yml
          git commit -m "Optimize mobile image loading [skip ci]"
          git push
