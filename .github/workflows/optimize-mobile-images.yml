name: Optimize mobile image loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-mobile-images.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize mobile image loading [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize image loading metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tags = list(re.finditer(r'<img\b[^>]*>', s, flags=re.I))
          if not tags:
              raise SystemExit('No img elements found')

          first_src_match = re.search(r'\bsrc\s*=\s*["\']([^"\']+)["\']', tags[0].group(0), re.I)
          first_src = first_src_match.group(1) if first_src_match else None

          def clean_attr(tag: str, name: str) -> str:
              return re.sub(r'\s' + name + r'\s*=\s*["\'][^"\']*["\']', '', tag, flags=re.I)

          def optimize(match_index: int, tag: str) -> str:
              tag = clean_attr(tag, 'loading')
              tag = clean_attr(tag, 'fetchpriority')
              tag = clean_attr(tag, 'decoding')
              if match_index == 0:
                  return tag[:-1] + ' loading="eager" fetchpriority="high" decoding="async">'
              return tag[:-1] + ' loading="lazy" decoding="async">'

          pieces = []
          cursor = 0
          for i, m in enumerate(tags):
              pieces.append(s[cursor:m.start()])
              pieces.append(optimize(i, m.group(0)))
              cursor = m.end()
          pieces.append(s[cursor:])
          s = ''.join(pieces)

          if first_src and not re.search(r'<link[^>]+rel=["\']preload["\'][^>]+as=["\']image["\'][^>]+', s, flags=re.I):
              preload = f'<link rel="preload" as="image" href="{first_src}" fetchpriority="high">'
              marker = '<link rel="stylesheet" href="style.css?v=27">'
              s = s.replace(marker, preload + '\n  ' + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -q 'loading="eager" fetchpriority="high"' index.html
          grep -q 'loading="lazy"' index.html

      - name: Commit optimization and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/optimize-mobile-images.yml
          git commit -m "Optimize mobile image loading [skip ci]"
          git push
