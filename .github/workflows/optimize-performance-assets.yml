name: Optimize Performance Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate optimized WebP assets and performance CSS
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          images = root / 'assets' / 'images'
          index = root / 'index.html'

          # Convert only large PNG assets that are actually used by the homepage.
          html = index.read_text(encoding='utf-8')
          png_refs = sorted(set(re.findall(r'assets/images/[^\"\']+\.png', html, flags=re.I)))
          converted = 0
          for ref in png_refs:
              src = root / ref
              if not src.exists() or src.stat().st_size < 300_000:
                  continue
              dst = src.with_suffix('.webp')
              try:
                  with Image.open(src) as im:
                      im = im.convert('RGBA') if 'A' in im.getbands() else im.convert('RGB')
                      # Keep enough resolution for desktop cards while avoiding multi-megapixel downloads.
                      max_side = 1400
                      if max(im.size) > max_side:
                          scale = max_side / max(im.size)
                          im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
                      im.save(dst, 'WEBP', quality=82, method=6)
                  html = html.replace(ref, str(dst).replace('\\', '/'))
                  converted += 1
              except Exception as exc:
                  print(f'WARN: could not convert {src}: {exc}')

          # Add stable intrinsic dimensions to local homepage images to reduce CLS.
          def add_dimensions(match):
              tag = match.group(0)
              src_match = re.search(r'src=[\"\'](assets/images/[^\"\']+)[\"\']', tag)
              if not src_match or re.search(r'\bwidth=[\"\']\d+[\"\']', tag) or re.search(r'\bheight=[\"\']\d+[\"\']', tag):
                  return tag
              path = root / src_match.group(1)
              if not path.exists():
                  return tag
              try:
                  with Image.open(path) as im:
                      w, h = im.size
                  return tag[:-1] + f' width="{w}" height="{h}">'
              except Exception:
                  return tag

          html = re.sub(r'<img\b[^>]*>', add_dimensions, html, flags=re.I)
          index.write_text(html, encoding='utf-8')

          css = root / 'performance.css'
          css.write_text('''/* Performance-only rules. Kept separate so layout styling stays untouched. */\n\n/* Avoid spending render time on sections far below the fold. */\n.products-section,\n.barley-wellness-section,\n.simple-grain-section,\n.discount-section,\n.more-than-section,\n.three-simple-steps-section,\n.stories-section,\n.barley-feature-section,\n#how-it-works,\n.inquiry-section {\n  content-visibility: auto;\n  contain-intrinsic-size: 900px;\n}\n\n/* Below-fold media should never compete with the hero request. */\n.products-section img,\n.barley-wellness-section img,\n.simple-grain-section img,\n.discount-section img,\n.stories-section img,\n.barley-feature-section img,\n#how-it-works img,\n.inquiry-section img {\n  content-visibility: auto;\n}\n''', encoding='utf-8')

          marker = '<link rel="stylesheet" href="performance.css?v=1">'
          if marker not in html:
              html = html.replace('</head>', f'  {marker}\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          print(f'Converted {converted} large PNG assets to WebP.')
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.webp index.html performance.css
          if git diff --cached --quiet; then
            echo "No optimization changes needed."
          else
            git commit -m "Optimize homepage image payload"
            git push
          fi
