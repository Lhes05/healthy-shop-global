name: Optimize Performance Assets

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'performance.css'
      - 'assets/images/*.png'
      - '.github/workflows/optimize-performance-assets.yml'

permissions:
  contents: write
  pages: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for concurrent site-edit workflows to settle
        run: sleep 120

      - name: Refresh latest main before optimizing
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate optimized WebP assets and performance CSS
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          png_refs = sorted(set(re.findall(r'assets/images/[^\"\']+\.png', html, flags=re.I)))
          converted = 0
          for ref in png_refs:
              src = root / ref
              if not src.exists() or src.stat().st_size < 300_000:
                  continue
              dst = src.with_suffix('.webp')
              try:
                  with Image.open(src) as im:
                      im = im.convert('RGBA') if 'A' in im.getbands() else im.convert('RGB')
                      max_side = 1400
                      if max(im.size) > max_side:
                          scale = max_side / max(im.size)
                          im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
                      im.save(dst, 'WEBP', quality=82, method=6)
                  html = html.replace(ref, str(dst).replace('\\', '/'))
                  converted += 1
              except Exception as exc:
                  print(f'WARN: could not convert {src}: {exc}')

          def add_dimensions(match):
              tag = match.group(0)
              src_match = re.search(r'src=[\"\'](assets/images/[^\"\']+)[\"\']', tag)
              if not src_match or re.search(r'\bwidth=[\"\']\d+[\"\']', tag) or re.search(r'\bheight=[\"\']\d+[\"\']', tag):
                  return tag
              path = root / src_match.group(1)
              if not path.exists():
                  return tag
              try:
                  with Image.open(path) as im:
                      w, h = im.size
                  return tag[:-1] + f' width="{w}" height="{h}">'
              except Exception:
                  return tag

          html = re.sub(r'<img\b[^>]*>', add_dimensions, html, flags=re.I)
          index.write_text(html, encoding='utf-8')

          css = root / 'performance.css'
          css.write_text('''/* Performance-only rules. Kept separate so layout styling stays untouched. */

.products-section,
.barley-wellness-section,
.simple-grain-section,
.discount-section,
.more-than-section,
.three-simple-steps-section,
.stories-section,
.barley-feature-section,
#how-it-works,
.inquiry-section {
  content-visibility: auto;
  contain-intrinsic-size: 900px;
}
''', encoding='utf-8')

          marker = '<link rel="stylesheet" href="performance.css?v=1">'
          if marker not in html:
              html = html.replace('</head>', f'  {marker}\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          print(f'Converted {converted} large PNG assets to WebP.')
          PY

      - name: Commit optimized assets with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.webp index.html performance.css
          if git diff --cached --quiet; then
            echo "No optimization changes needed."
            exit 0
          fi
          git commit -m "Optimize homepage image payload"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              echo "PUSHED=1" >> "$GITHUB_ENV"
              exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Push attempt $attempt lost a race; regenerating from latest main..."
            python - <<'PY'
            from pathlib import Path
            from PIL import Image
            import re
            root=Path('.')
            index=root/'index.html'
            html=index.read_text(encoding='utf-8')
            for ref in sorted(set(re.findall(r'assets/images/[^\"\']+\.png', html, flags=re.I))):
                src=root/ref
                if not src.exists() or src.stat().st_size < 300_000: continue
                dst=src.with_suffix('.webp')
                with Image.open(src) as im:
                    im=im.convert('RGBA') if 'A' in im.getbands() else im.convert('RGB')
                    if max(im.size)>1400:
                        s=1400/max(im.size); im=im.resize((round(im.width*s),round(im.height*s)),Image.Resampling.LANCZOS)
                    im.save(dst,'WEBP',quality=82,method=6)
                html=html.replace(ref,str(dst).replace('\\','/'))
            def dims(m):
                t=m.group(0); sm=re.search(r'src=[\"\'](assets/images/[^\"\']+)[\"\']',t)
                if not sm or 'width=' in t or 'height=' in t: return t
                p=root/sm.group(1)
                try:
                    with Image.open(p) as im: w,h=im.size
                    return t[:-1]+f' width="{w}" height="{h}">'
                except: return t
            html=re.sub(r'<img\b[^>]*>',dims,html,flags=re.I)
            marker='<link rel="stylesheet" href="performance.css?v=1">'
            if marker not in html: html=html.replace('</head>',f'  {marker}\n</head>',1)
            index.write_text(html,encoding='utf-8')
            PY
            git add assets/images/*.webp index.html performance.css
            git commit -m "Optimize homepage image payload" --amend --no-edit || true
            sleep $((attempt * 5))
          done
          echo "Unable to push optimized assets after retries."
          exit 1

      - name: Request GitHub Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds
