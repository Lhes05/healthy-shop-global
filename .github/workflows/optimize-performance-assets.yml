name: Optimize Performance Assets

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'performance.css'
      - 'assets/images/*.png'
      - '.github/workflows/optimize-performance-assets.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate optimized WebP assets and performance CSS
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          png_refs = sorted(set(re.findall(r'assets/images/[^\"\']+\.png', html, flags=re.I)))
          converted = 0
          for ref in png_refs:
              src = root / ref
              if not src.exists() or src.stat().st_size < 300_000:
                  continue
              dst = src.with_suffix('.webp')
              try:
                  with Image.open(src) as im:
                      im = im.convert('RGBA') if 'A' in im.getbands() else im.convert('RGB')
                      max_side = 1400
                      if max(im.size) > max_side:
                          scale = max_side / max(im.size)
                          im = im.resize((round(im.width * scale), round(im.height * scale)), Image.Resampling.LANCZOS)
                      im.save(dst, 'WEBP', quality=82, method=6)
                  html = html.replace(ref, str(dst).replace('\\', '/'))
                  converted += 1
              except Exception as exc:
                  print(f'WARN: could not convert {src}: {exc}')

          def add_dimensions(match):
              tag = match.group(0)
              src_match = re.search(r'src=[\"\'](assets/images/[^\"\']+)[\"\']', tag)
              if not src_match or re.search(r'\bwidth=[\"\']\d+[\"\']', tag) or re.search(r'\bheight=[\"\']\d+[\"\']', tag):
                  return tag
              path = root / src_match.group(1)
              if not path.exists():
                  return tag
              try:
                  with Image.open(path) as im:
                      w, h = im.size
                  return tag[:-1] + f' width="{w}" height="{h}">'
              except Exception:
                  return tag

          html = re.sub(r'<img\b[^>]*>', add_dimensions, html, flags=re.I)
          index.write_text(html, encoding='utf-8')

          css = root / 'performance.css'
          css.write_text('''/* Performance-only rules. Kept separate so layout styling stays untouched. */

.products-section,
.barley-wellness-section,
.simple-grain-section,
.discount-section,
.more-than-section,
.three-simple-steps-section,
.stories-section,
.barley-feature-section,
#how-it-works,
.inquiry-section {
  content-visibility: auto;
  contain-intrinsic-size: 900px;
}
''', encoding='utf-8')

          marker = '<link rel="stylesheet" href="performance.css?v=1">'
          if marker not in html:
              html = html.replace('</head>', f'  {marker}\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          print(f'Converted {converted} large PNG assets to WebP.')
          PY

      - name: Commit optimized assets with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.webp index.html performance.css
          if git diff --cached --quiet; then
            echo "No optimization changes needed."
            exit 0
          fi
          git commit -m "Optimize homepage image payload"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Unable to push optimized assets after retries."
          exit 1
