name: Add Santé Story 06
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add-story-06:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the Story 06 image already in assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/images/hsg-poster-06.jpg'
          new = 'assets/images/story-06.png'
          if old in s:
              s = s.replace(old, new)
          elif new in s:
              raise SystemExit(0)
          else:
              raise SystemExit('Story 06 image reference not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Story 06 image change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Use new Story 06 image'
          git push
