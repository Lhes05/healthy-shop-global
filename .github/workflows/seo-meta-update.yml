name: Apply SEO metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/seo-meta-update.yml'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          title = 'Santé Philippines | Santé Barley & Wellness Products | Everyday Wellness'
          desc = 'Discover Santé Philippines wellness products including Santé Barley, plant-based nutrition, membership benefits and business opportunities for everyday wellness.'
          ogdesc = 'Explore Santé Philippines wellness products, Santé Barley, member benefits and business opportunities for everyday wellness.'
          twdesc = 'Discover Santé Barley, wellness products, membership benefits and business opportunities with Santé Philippines.'
          replacements = {
            '<meta name="description" content="Santé Everyday Wellness — Better choices. Better everyday.">': f'<meta name="description" content="{desc}">',
            '<title>Santé Everyday Wellness</title>': f'<title>{title}</title>',
            '<meta property="og:site_name" content="Santé Everyday Wellness">': '<meta property="og:site_name" content="Santé Philippines">',
            '<meta property="og:title" content="Santé Everyday Wellness — Better choices. Better everyday.">': f'<meta property="og:title" content="{title}">',
            '<meta property="og:description" content="Discover everyday wellness, trusted products, real experiences and a supportive community with Santé.">': f'<meta property="og:description" content="{ogdesc}">',
            '<meta name="twitter:title" content="Santé Everyday Wellness">': f'<meta name="twitter:title" content="{title}">',
            '<meta name="twitter:description" content="Everyday wellness, real experiences and meaningful possibilities with Santé.">': f'<meta name="twitter:description" content="{twdesc}">',
            '"description":"Everyday wellness, products, real experiences and community."': '"description":"Santé Philippines wellness products, Santé Barley, membership benefits and business opportunities for everyday wellness."',
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SEO update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "SEO metadata already up to date."
          else
            git commit -m "Optimize homepage SEO metadata [skip ci]"
            git push
          fi
