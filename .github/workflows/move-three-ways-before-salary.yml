name: Move Three Ways Before Salary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-section:
    if: ${{ github.event.head_commit.message != 'Move Three Ways directly above salary section' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Three Ways and refine spacing
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          three = re.search(r'<section id="how-it-works"[\s\S]*?</section>\s*', s, re.I)
          if not three:
              raise SystemExit('Three Ways section not found')
          block = three.group(0).strip()
          s = s[:three.start()] + s[three.end():]

          salary_heading = re.search(r'<h2[^>]*>\s*DO YOU HAVE ANY OTHER OPTION BESIDES YOUR SALARY\?\s*</h2>', s, re.I)
          if not salary_heading:
              raise SystemExit('Salary heading not found')

          # Find the section containing the salary heading.
          section_start = s.rfind('<section', 0, salary_heading.start())
          if section_start < 0:
              raise SystemExit('Salary section start not found')
          section_end = s.find('</section>', salary_heading.end())
          if section_end < 0:
              raise SystemExit('Salary section end not found')
          insert_at = section_start
          s = s[:insert_at] + block + '\n' + s[insert_at:]

          css = '''
          <style id="three-ways-final-layout">
          #how-it-works{padding:54px 0 60px!important;margin:0!important}
          #how-it-works .sc-wrap{width:min(1180px,calc(100% - 40px));margin:0 auto}
          #how-it-works .sc-title{font-size:clamp(34px,3.8vw,50px);line-height:1.04;letter-spacing:-2.3px;margin-bottom:10px}
          #how-it-works .sc-lead{font-size:14px;line-height:1.5}
          #how-it-works .sc-grid{gap:12px;margin-top:20px}
          #how-it-works .sc-card{min-height:175px;padding:18px 16px;border-radius:16px}
          #how-it-works .sc-card h3{font-size:16px;margin-bottom:6px}
          #how-it-works .sc-card p{font-size:11.5px;line-height:1.45}
          #how-it-works .sc-cta-row{margin-top:14px}
          #how-it-works .sc-btn{min-height:40px;padding:0 16px;font-size:11px}
          @media(max-width:900px){#how-it-works{padding:42px 0 48px!important}#how-it-works .sc-grid{grid-template-columns:1fr;gap:10px}#how-it-works .sc-card{min-height:auto}}
          @media(max-width:500px){#how-it-works .sc-wrap{width:calc(100% - 28px)}#how-it-works .sc-title{font-size:34px;letter-spacing:-1.8px}}
          </style>
          '''
          s = re.sub(r'<style id="three-ways-final-layout">[\s\S]*?</style>\s*', '', s, flags=re.I)
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move Three Ways directly above salary section"
          git push