name: Run Google Search Console verification now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verification tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="LFG_DYf_CITRjxeZVOjoJ-Nt5YQG4hN5tpbTKxjLguQ" />'
          if tag not in s:
              marker = '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
              if marker not in s:
                  raise SystemExit('Viewport marker not found')
              s = s.replace(marker, marker + '\n  ' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add GSC verification tag now'
          git push
