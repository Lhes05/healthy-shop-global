name: Fix Become a Member link

on:
  push:
    branches: [main]

jobs:
  fix-member-link:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update member link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'href=["\']https://international\.mysante\.com/Registration\.aspx["\']', 'href="https://partner.mysante.com/epackage"', s)
          s = re.sub(r'(<a\b[^>]*href="https://partner\.mysante\.com/epackage"[^>]*)>', lambda m: m.group(1) + (' target="_blank" rel="noopener noreferrer">' if 'target=' not in m.group(1) else '>'), s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set Become a Member to epackage"
          git push