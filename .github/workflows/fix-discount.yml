name: Fix discount section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix discount image and link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="https://partner.mysante.com/shop/premium" target="_blank" rel="noopener noreferrer">GET DISCOUNT →</a>', 'href="https://partner.mysante.com/epackage" target="_blank" rel="noopener noreferrer">GET DISCOUNT →</a>')
          marker = '</style>'
          override = '    .discount-card img{object-fit:contain!important;aspect-ratio:auto!important;max-height:520px;background:#fff}\n'
          if override not in s:
              s = s.replace(marker, override + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix discount image and link'
          git push
