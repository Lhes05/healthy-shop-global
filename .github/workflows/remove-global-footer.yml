name: Remove Global Footer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove global footer block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'\s*<!-- SANTE-GLOBAL-TRUST-FOOTER -->\s*<div class="sante-global-footer"[^>]*>.*?</div>\s*</div>\s*'
          new_text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count:
              path.write_text(new_text, encoding='utf-8')
          print(f'Removed footer blocks: {count}')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No footer block found; nothing to commit."
          else
            git commit -m "Remove global footer"
            git push
          fi
