name: Fix Chat Menu Selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-chat-menu:
    if: ${{ github.event.head_commit.message != 'Fix Chat Menu Selection' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add selection behavior override
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* CHAT MENU SELECTION FIX */'
          if marker in s:
              raise SystemExit(0)
          script = '''
  <script>
    /* CHAT MENU SELECTION FIX */
    (function(){
      const panel=document.getElementById('helpChatPanel');
      const options=document.querySelector('#helpChatPanel .help-chat-options');
      const details=document.getElementById('helpOrderDetails');
      const order=document.querySelector('#helpChatPanel .help-chat-option[data-target="products"]');
      if(!panel||!options)return;

      function showOrder(){
        options.style.display='grid';
        if(details){details.classList.add('is-open');details.setAttribute('aria-hidden','false');}
      }
      function closeOrder(){
        if(details){details.classList.remove('is-open');details.setAttribute('aria-hidden','true');}
      }

      panel.addEventListener('click',function(e){
        const btn=e.target.closest('.help-chat-option');
        if(!btn || !panel.contains(btn)) return;

        /* Let leslie-chat.js own the Talk to Leslie button. */
        if((btn.textContent || '').toLowerCase().includes('talk to leslie')) return;

        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();

        const target=btn.dataset.target;
        if(target==='products'){
          showOrder();
          return;
        }

        // Selecting another option closes the currently open order details,
        // but keeps the main four choices visible and clickable.
        closeOrder();
        const section=document.getElementById(target);
        if(section) section.scrollIntoView({behavior:'smooth',block:'start'});
        const message=btn.dataset.message;
        if(message){
          const field=document.getElementById('inquiryMessage');
          if(field){field.value=message;}
        }
      },true);

      if(order) order.setAttribute('aria-expanded','false');
    })();
  </script>
'''
          s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Chat Menu Selection"
          git push
