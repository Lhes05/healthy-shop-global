name: Optimize hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-hero-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize hero image for mobile LCP [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create optimized WebP and tune hero markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path('assets/images/product-barley-canister.png')
          out = Path('assets/images/product-barley-canister.webp')
          img = Image.open(src).convert('RGB')
          max_width = 720
          if img.width > max_width:
              new_h = round(img.height * max_width / img.width)
              img = img.resize((max_width, new_h), Image.Resampling.LANCZOS)
          out.parent.mkdir(parents=True, exist_ok=True)
          img.save(out, 'WEBP', quality=82, method=6)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/images/product-barley-canister.png'
          new = 'assets/images/product-barley-canister.webp'
          s = s.replace(old, new)

          preload = f'<link rel="preload" as="image" href="{new}" fetchpriority="high">'
          s = re.sub(r'\s*<link\s+rel=["\']preload["\'][^>]*as=["\']image["\'][^>]*>', '', s, flags=re.I)
          marker = '<link rel="stylesheet" href="style.css?v=27">'
          if preload not in s and marker in s:
              s = s.replace(marker, preload + '\n  ' + marker, 1)

          pattern = re.compile(r'<img\b[^>]*src=["\']' + re.escape(new) + r'["\'][^>]*>', re.I)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Optimized hero image tag not found')
          tag = m.group(0)
          def remove_attr(t, name):
              return re.sub(r'\s' + name + r'\s*=\s*["\'][^"\']*["\']', '', t, flags=re.I)
          for attr in ('loading','fetchpriority','decoding','width','height'):
              tag = remove_attr(tag, attr)
          tag = tag[:-1] + f' width="{img.width}" height="{img.height}" loading="eager" fetchpriority="high" decoding="async">'
          s = s[:m.start()] + tag + s[m.end():]
          p.write_text(s, encoding='utf-8')
          print(f'Created {out}: {out.stat().st_size} bytes ({img.width}x{img.height})')
          PY

      - name: Verify
        run: |
          test -s assets/images/product-barley-canister.webp
          grep -q 'product-barley-canister.webp' index.html
          grep -q 'width="' index.html
          grep -q 'height="' index.html
          grep -q '<link rel="preload" as="image" href="assets/images/product-barley-canister.webp" fetchpriority="high">' index.html

      - name: Commit optimized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/product-barley-canister.webp index.html
          git commit -m "Optimize hero image for mobile LCP [skip ci]"
          git push origin HEAD:main

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/optimize-hero-image.yml
          git commit -m "Remove one-time hero optimizer [skip ci]"
          git push origin HEAD:main
