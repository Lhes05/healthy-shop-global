name: Clean Global HTML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-global-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Leslie script reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          duplicate = '  <script src="leslie-chat.js?v=2"></script>\n  <script src="leslie-chat.js?v=1"></script>'
          single = '  <script src="leslie-chat.js?v=2"></script>'
          if duplicate in s:
              s = s.replace(duplicate, single, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove duplicate Leslie chat script [skip ci]"
          git push
