name: Optimize Performance Assets

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Optimize large PNG images
        run: |
          python -m pip install pillow
          python -c "from pathlib import Path; from PIL import Image; root=Path('.'); index=root/'index.html'; html=index.read_text(encoding='utf-8'); changed=False; files=list((root/'assets'/'images').glob('*.png')); [((lambda dst,src: (Image.open(src).convert('RGBA') if 'A' in Image.open(src).getbands() else Image.open(src).convert('RGB')).save(dst,'WEBP',quality=82,method=6))(src.with_suffix('.webp'),src), None) for src in files if src.stat().st_size>=300000]; [None for src in files if src.stat().st_size>=300000 and not (lambda dst: dst.exists())(src.with_suffix('.webp'))]; html=__import__('functools').reduce(lambda h,src: h.replace('assets/images/'+src.name,'assets/images/'+src.with_suffix('.webp').name), [src for src in files if src.stat().st_size>=300000], html); index.write_text(html,encoding='utf-8'); Path('performance.css').write_text('/* Performance optimizations */\n.products-section,.barley-wellness-section,.simple-grain-section,.discount-section,.more-than-section,.three-simple-steps-section,.stories-section,.barley-feature-section,#how-it-works,.inquiry-section{content-visibility:auto;contain-intrinsic-size:900px;}\n',encoding='utf-8')"

      - name: Add image dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def fix(m):
              tag=m.group(0)
              if 'width=' in tag or 'height=' in tag:
                  return tag
              src=re.search(r'src=["\']([^"\']+)',tag)
              if not src:
                  return tag
              f=Path(src.group(1))
              if not f.exists():
                  return tag
              try:
                  from PIL import Image
                  with Image.open(f) as im:
                      w,h=im.size
                  return tag[:-1] + f' width="{w}" height="{h}">' 
              except Exception:
                  return tag
          s=re.sub(r'<img\b[^>]*>',fix,s,flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Link performance CSS
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='<link rel=\"stylesheet\" href=\"performance.css\">'; s=s if marker in s else s.replace('</head>',marker+'\n</head>',1); p.write_text(s,encoding='utf-8')"

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.webp index.html performance.css
          if git diff --cached --quiet; then echo "No optimization changes needed"; exit 0; fi
          git commit -m "Optimize homepage image payload"
          git push origin main

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST /repos/${{ github.repository }}/pages/builds