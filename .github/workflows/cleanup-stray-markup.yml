name: Clean stray markup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove literal escaped-newline artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chat-menu-keep-options.js')
          s = p.read_text(encoding='utf-8')
          old = """        const cleaned = value\n          .replace(/^[\\s\\\\]+(?=\\n|$)/g, '')\n          .replace(/\\\\(?=\\s*(?:<|$))/g, '')\n          .replace(/^\\\\\\s*$/gm, '')\n          .replace(/\\\\\\n/g, '\\n');"""
          new = """        const cleaned = value\n          .replace(/(?:\\\\n)+/g, '')\n          .replace(/\\\\(?=\\s*(?:<|$))/g, '')\n          .replace(/^[\\s\\\\]+(?=\\n|$)/g, '')\n          .replace(/\\\\\\n/g, '\\n');"""
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-menu-keep-options.js
          git commit -m "Fix literal escaped newline artifacts"
          git push
