name: Clean stray markup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for concurrent homepage workflows
        run: sleep 60
      - name: Rebase on latest main
        run: git pull --rebase origin main
      - name: Remove literal escaped-newline artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chat-menu-keep-options.js')
          s = p.read_text(encoding='utf-8')
          old = """        const cleaned = value\n          .replace(/^[\\s\\\\]+(?=\\n|$)/g, '')\n          .replace(/\\\\(?=\\s*(?:<|$))/g, '')\n          .replace(/^\\\\\\s*$/gm, '')\n          .replace(/\\\\\\n/g, '\\n');"""
          new = """        const cleaned = value\n          .replace(/(?:\\\\n)+/g, '')\n          .replace(/\\\\(?=\\s*(?:<|$))/g, '')\n          .replace(/^[\\s\\\\]+(?=\\n|$)/g, '')\n          .replace(/\\\\\\n/g, '\\n');"""
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Remove Contact and Trust section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<section class="sc-contact" id="contact">.*?</section>\\'
          cleaned = re.sub(pattern, '', s, count=1, flags=re.S)
          if cleaned != s:
              p.write_text(cleaned, encoding='utf-8')
          PY
      - name: Remove Global Trust Footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\s*<!-- SANTE-GLOBAL-TRUST-FOOTER -->\s*<div class="sante-global-footer"[^>]*>.*?</div>\s*</div>\s*'
          cleaned = re.sub(pattern, '\n', s, count=1, flags=re.S)
          if cleaned != s:
              p.write_text(cleaned, encoding='utf-8')
          PY
      - name: Install inquiry form fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="inquiry-form-fix.js?v=2"></script>'
          if 'inquiry-form-fix.js' not in s:
              s = s.replace('</body>', '  ' + tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-menu-keep-options.js index.html
          git commit -m "Fix inquiry form and cleanup homepage"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
